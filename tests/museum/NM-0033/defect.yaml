id: NM-0033
symptom: "from_config(governance=...) accepted a controlled vocabulary and load_dictionary never applied it, so every indexed entry carried no protection code and every match came back with governance=null -- indistinguishable from a glossary that declares no classes"
severity: HIGH
fixed_in: 2.1.0
gate_that_should_have_caught_it: "none -- every governance test on the matcher called the private _index_dictionary with entries a fixture had already coded by hand, so nothing in the suite ever loaded a glossary through the documented load_dictionary() path and asked what class came back"
gate_that_catches_it_now: "tests/museum/NM-0033/test_nm_0033.py, plus tests/unit/application/test_governance_through_load_dictionary.py"
touches:
  - src/nexus_matcher/application/use_cases/match_schema.py
notes: >
  Governance inheritance is the headline capability of the 2.1.0 work, and this defect is
  in the commit that cut it: `git show 36ffc1d:src/nexus_matcher/application/use_cases/
  match_schema.py` has a load_dictionary containing the word "governance" zero times.
  CHANGELOG.md records that 2.1.0 was never published, so this did not reach PyPI -- but
  release_preflight.py declared the wheel built from that tree fit to publish, so nothing
  between there and a publish was going to stop it. The DictionaryLoader
  port hands back finished DictionaryEntry objects and has no field for a protection code,
  so the loaders this package ships built every entry with governance_code=None and there
  was no layer left to notice: with no code attached there is nothing for any consumer to
  refuse. The library's own HTTP app had already worked around it by calling
  ingest.load_entries and the private _index_dictionary, and said so in a docstring; the
  example pack printed a WIRING DEFECT banner and rescued the class with a caller-side
  join. Both descriptions were accurate and neither was a gate. Same shape as the
  config_path parameter this repository retracted once already: accepted, then never read.
