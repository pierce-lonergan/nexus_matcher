# pyproject.toml | Env: ALL
# NexusMatcher - Enterprise Semantic Schema Matching System
# SENSITIVE: No | REQUIRED_BY: all modules, CI/CD, packaging

[build-system]
requires = ["hatchling>=1.18.0", "hatch-vcs>=0.3.0"]
build-backend = "hatchling.build"

[project]
name = "nexus-matcher"
dynamic = ["version"]
description = "Enterprise-grade semantic schema matching system using neural embeddings, ColBERT reranking, and multi-signal scoring for automated data dictionary mapping"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "Pierce Lonergan", email = "lonerganpierce@gmail.com" }
]
maintainers = [
    { name = "Pierce Lonergan", email = "lonerganpierce@gmail.com" }
]
keywords = [
    "schema-matching",
    "semantic-search",
    "data-governance",
    "data-dictionary",
    "data-catalog",
    "embeddings",
    "vector-search",
    "colbert",
    "sentence-transformers",
    "nlp",
    "machine-learning",
    "data-engineering",
    "metadata-management",
    "enterprise",
    "avro",
    "json-schema",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Framework :: FastAPI",
    "Typing :: Typed",
    "Natural Language :: English",
]

# =============================================================================
# DEPENDENCIES - Layered for flexibility
# =============================================================================

# Core dependencies (library mode - minimal)
# Note: numpy 2.x required for Python 3.13 prebuilt wheels
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "structlog>=23.0.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
# Embedding providers
embeddings = [
    "sentence-transformers>=2.2.0,<3.0.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

# Vector stores
vector-stores = [
    "qdrant-client>=1.6.0,<2.0.0",
    "faiss-cpu>=1.7.4",
]

# Sparse retrieval
sparse = [
    "rank-bm25>=0.2.2",
]

# Caching
cache = [
    "redis>=4.5.0",
    "diskcache>=5.6.0",
]

# Schema parsers
parsers = [
    "fastavro>=1.8.0",        # Avro
    "jsonschema>=4.17.0",     # JSON Schema
    "sqlparse>=0.4.4",        # SQL DDL
]

# Dictionary loaders
loaders = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "sqlalchemy>=2.0.0",
]

# REST API server
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
]

# CLI
cli = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
]

# Async processing
async = [
    "celery>=5.3.0",
]

# Full installation (all features)
full = [
    "nexus-matcher[embeddings,vector-stores,sparse,cache,parsers,loaders,api,cli,async]",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "hypothesis>=6.82.0",
    "mypy>=1.5.0",
    "ruff>=0.0.290",
    "black>=23.7.0",
    "pre-commit>=3.3.0",
    "httpx>=0.24.0",  # For testing FastAPI
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.2.0",
    "mkdocstrings[python]>=0.23.0",
]

# =============================================================================
# ENTRY POINTS
# =============================================================================

[project.scripts]
nexus-matcher = "nexus_matcher.presentation.cli.main:app"

[project.entry-points."nexus_matcher.schema_parsers"]
avro = "nexus_matcher.infrastructure.adapters.schema_parsers.avro:AvroSchemaParser"
json_schema = "nexus_matcher.infrastructure.adapters.schema_parsers.json_schema:JsonSchemaParser"
sql_ddl = "nexus_matcher.infrastructure.adapters.schema_parsers.sql_ddl:SqlDdlParser"
csv = "nexus_matcher.infrastructure.adapters.schema_parsers.csv_headers:CsvHeaderParser"

[project.entry-points."nexus_matcher.dictionary_loaders"]
excel = "nexus_matcher.infrastructure.adapters.dictionary_loaders.excel:ExcelDictionaryLoader"
csv = "nexus_matcher.infrastructure.adapters.dictionary_loaders.csv:CsvDictionaryLoader"
database = "nexus_matcher.infrastructure.adapters.dictionary_loaders.database:DatabaseDictionaryLoader"

[project.entry-points."nexus_matcher.vector_stores"]
qdrant = "nexus_matcher.infrastructure.adapters.vector_stores.qdrant:QdrantVectorStore"
faiss = "nexus_matcher.infrastructure.adapters.vector_stores.faiss:FaissVectorStore"
memory = "nexus_matcher.infrastructure.adapters.vector_stores.memory:InMemoryVectorStore"

[project.entry-points."nexus_matcher.embedding_providers"]
sentence_transformers = "nexus_matcher.infrastructure.adapters.embedding_providers.sentence_transformers:SentenceTransformersProvider"
openai = "nexus_matcher.infrastructure.adapters.embedding_providers.openai:OpenAIEmbeddingProvider"

[project.urls]
Homepage = "https://github.com/pierce-lonergan/nexus_matcher"
Documentation = "https://nexus-matcher.readthedocs.io"
Repository = "https://github.com/pierce-lonergan/nexus_matcher"
Issues = "https://github.com/pierce-lonergan/nexus_matcher/issues"
Changelog = "https://github.com/pierce-lonergan/nexus_matcher/blob/main/CHANGELOG.md"

# =============================================================================
# BUILD CONFIGURATION
# =============================================================================

[tool.hatch.version]
path = "src/nexus_matcher/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_matcher"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/benchmarks",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "QUICKSTART.md",
    "py.typed",
]
exclude = [
    "/.github",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.mypy_cache",
    "/.coverage",
    "/htmlcov",
    "/dist",
    "/build",
    "*.pyc",
    "__pycache__",
]

# =============================================================================
# TOOL CONFIGURATION
# =============================================================================

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["nexus_matcher"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "torch.*",
    "transformers.*",
    "qdrant_client.*",
    "faiss.*",
    "rank_bm25.*",
    "celery.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=nexus_matcher",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "e2e: End-to-end tests (full system)",
    "slow: Slow tests (skip with -m 'not slow')",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/nexus_matcher"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
fail_under = 80

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
