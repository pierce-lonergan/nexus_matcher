# pyproject.toml | Env: ALL
# NexusMatcher - Enterprise Semantic Schema Matching System
# SENSITIVE: No | REQUIRED_BY: all modules, CI/CD, packaging

[build-system]
# hatchling floor raised from 1.18 for the PEP 639 `license`/`license-files` keys below.
# 1.18 predates them and would fall back to treating the SPDX string as a legacy free-text
# license, which is the exact metadata bug those keys exist to fix.
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.3.0"]
build-backend = "hatchling.build"

[project]
name = "nexus-matcher"
dynamic = ["version"]
description = "Enterprise-grade semantic schema matching system using neural embeddings, ColBERT reranking, and multi-signal scoring for automated data dictionary mapping"
readme = "README.md"
# PEP 639. `license = {file = "LICENSE"}` inlined all 11315 characters of the Apache-2.0
# text into the metadata's License: field (12915 chars over 201 continuation lines), and
# left License-Expression empty even though the build emits Metadata-Version 2.4. PyPI
# reads the expression, not the free-text field, so the sidebar showed no license at all
# while the wall of licence text sat in the metadata nobody renders.
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Pierce Lonergan", email = "lonerganpierce@gmail.com" }
]
maintainers = [
    { name = "Pierce Lonergan", email = "lonerganpierce@gmail.com" }
]
keywords = [
    "schema-matching",
    "semantic-search",
    "data-governance",
    "data-dictionary",
    "data-catalog",
    "embeddings",
    "vector-search",
    "colbert",
    "sentence-transformers",
    "nlp",
    "machine-learning",
    "data-engineering",
    "metadata-management",
    "enterprise",
    "avro",
    "json-schema",
]
classifiers = [
    # 5, not 4 - Beta: CHANGELOG.md records 1.0.0 (2025-10-15) and 2.0.0 (2025-12-09),
    # the public surface is pinned by __all__ and documented in docs/API_REFERENCE.md,
    # and the entry points are regression-tested. "Beta" on a 2.0.x line understates it.
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    # The Apache-2.0 license classifier is deliberately gone: PEP 639 deprecates the
    # License :: trove classifiers in favour of the SPDX `license` expression set above,
    # and declaring both makes tools disagree about which one is authoritative.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Framework :: FastAPI",
    "Typing :: Typed",
    "Natural Language :: English",
]

# =============================================================================
# DEPENDENCIES - Layered for flexibility
# =============================================================================

# Core dependencies (library mode - minimal)
# Note: numpy 2.x required for Python 3.13 prebuilt wheels
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "structlog>=23.0.0",
    # typing-extensions was dropped 2026-08-09: `grep -rn typing.extensions src tests
    # benchmarks scripts docs` returns hits in requirements.txt and this file only. The
    # package targets 3.10+, where every typing construct it uses is already in `typing`.
    # The bundled int8 encoder is the DEFAULT provider and the reason `pip install
    # nexus-matcher` works with no download. Its runtime therefore belongs in the core
    # dependencies, not an extra -- making these optional produced a package that shipped
    # a 33.8 MB model it could not load, and CI caught it on all four Python versions.
    # Both are pure wheels with no torch and no compiler requirement.
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    # C++ Levenshtein on the per-candidate hot path: ~145x the pure-Python DP fallback.
    "rapidfuzz>=3.0.0",
    # rank-bm25 is deliberately NOT here. BM25Retriever used to delegate to its
    # BM25Okapi, which scored every document for every query term; it now uses a numpy
    # inverted index and imports nothing. rank-bm25 survives only in `dev`, where the
    # tests pin the new scores against it. Shipping a core dependency that no runtime
    # code imports is the same defect this release removed elsewhere.
    # Enterprise data dictionaries are overwhelmingly .xlsx, and the documented
    # quickstart loads one. A 251 KB pure-Python wheel with a single small dependency
    # is a fair price for `load_dictionary("glossary.xlsx")` working on a bare install;
    # pandas, which this replaced, was ~50 MB of transitive weight for the same job.
    "openpyxl>=3.1.0",
    # [project.scripts] declares `nexus-matcher` unconditionally, and README installs with
    # a bare `pip install nexus-matcher` and then runs `nexus-matcher match customer.avsc`
    # eight lines later. With these two in the `cli` extra instead, that documented second
    # step died on `import typer` at presentation/cli/main.py:22 -- a raw ModuleNotFoundError
    # traceback from a command pip had just put on PATH. It never showed up in development
    # because typer is in the `dev` install and in CI, so every environment that ran the CLI
    # already had it; only a first-time user following the README ever saw it.
    # Same standard as rank-bm25 and openpyxl above: 122 KB and 303 KB of pure-Python wheel,
    # no torch, no compiler. Current typer requires rich outright (0.27.1 Requires-Dist:
    # rich>=13.8.0), so for anyone on a modern typer the `cli` extra was never saving the
    # download it appeared to. rich stays declared here rather than leaned on transitively,
    # because the >=0.9.0 floor still admits typer 0.9.x, which does not pull rich at all.
    "typer>=0.9.0",
    "rich>=13.0.0",
    # tomllib is stdlib from 3.11; this package supports 3.10, where
    # `NexusMatcher.from_config("matching.toml")` -- the line printed in both README and
    # QUICKSTART -- raises ModuleNotFoundError without a backport. 15 KB, pure Python, and
    # the marker means 3.11+ installs get nothing at all.
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Embedding providers
embeddings = [
    # The <3.0.0 cap excluded the version this project is actually developed and
    # benchmarked against (sentence-transformers 5.6.1 in the working env; every
    # accuracy number in CHANGELOG was measured on it). CI would have resolved to
    # a 2.x release with a different API. Cap removed; floor kept.
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

# Vector stores
vector-stores = [
    "qdrant-client>=1.6.0,<2.0.0",
    # usearch backs HnswVectorStore. Chosen over hnswlib, which has no Python 3.13
    # wheel and fails to build from source without a configured C++ toolchain.
    "usearch>=2.12.0",
]

# Sparse retrieval. BM25 is BUILT IN and always available -- BM25Retriever runs on a
# numpy inverted index and imports nothing -- so this extra installs nothing the default
# pipeline needs. It is kept as a name purely so `nexus-matcher[sparse]` keeps resolving
# for anyone who pinned it, and rank-bm25 is here only because the tests compare the
# built-in scores against it.
sparse = [
    "rank-bm25>=0.2.2",
]

# Native accelerators. Everything here has a pure-Python or stdlib fallback, so the
# package still works without them - it is just slower. Declared because
# application/use_cases/match_schema.py imports rapidfuzz at module scope (inside
# a try/except) and it was previously installed in dev environments by accident,
# never by declaration, so a clean `pip install` silently got the slow path.
accel = [
    "rapidfuzz>=3.0.0",   # C++ Levenshtein, ~145x faster than the DP fallback
    # Both of these degrade quietly, which is why nobody noticed they were unreachable:
    # caches/content.py and adapters/incremental fall back to hashlib and log a warning,
    # and quantized.py's Windows AVX2/AVX512/VNNI probe just reports every feature absent.
    # You got the slow path and a correct-looking answer either way.
    "blake3>=0.4.0",      # 8-10x SHA-256 for content hashing; hashlib otherwise
    "py-cpuinfo>=9.0.0",  # CPU feature detection on Windows; no SIMD dispatch otherwise
]

# Graph-based structural matching (core/graph_matcher.py). The module already guards the
# import with NETWORKX_AVAILABLE, so without networkx it imports fine and every
# graph-matching entry point is simply inert.
graph = [
    "networkx>=3.0",
]

# Metrics backends. shared/metrics.py raises ImportError with install hints for both of
# these, and until now the hints named packages no extra could deliver.
observability = [
    "prometheus-client>=0.17.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

# INT8/dynamic quantization of embedding models (embedding_providers/quantized.py).
# onnxruntime is already core; the export path additionally needs the onnx graph library
# and a torch/transformers pair to load the source model.
quantization = [
    "onnx>=1.15.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

# Static (torch-free) embeddings. Backs the `static` embedding provider registered in
# [project.entry-points] and the third rung of bundled_onnx.py's auto fallback chain, so
# plugin discovery advertised a provider that nothing could install.
static-embeddings = [
    "model2vec>=0.3.0",
]

# ColBERT MaxSim late-interaction reranking (rerankers/colbert.py). The package summary and
# the `colbert` keyword both advertise this, and ColBERTMaxSimReranker is the only non-mock
# implementation of it, yet ragatouille was reachable from no extra - there was no supported
# way to install the headline feature.
#
# Deliberately NOT in `full`, and the only extra excluded from it. Verified 2026-08-09 on
# CPython 3.13: `pip install ragatouille` is ResolutionImpossible for all 18 published
# versions, because every langchain-core release caps at Requires-Python <3.12 and its
# `voyager` dependency publishes no wheel at all ("No matching distribution found"). Folding
# it into `full` would turn `pip install nexus-matcher[full]` into a hard resolver error on
# two of the four Python versions this project classifies as supported. Keeping it separate
# means `[full]` still resolves everywhere and users who want ColBERT ask for it explicitly
# on a Python that can take it.
colbert = [
    "ragatouille>=0.0.8",  # requires Python <3.12; see above
]

# Caching
cache = [
    "redis>=4.5.0",
    "diskcache>=5.6.0",
]

# Schema parsers
parsers = [
    "fastavro>=1.8.0",        # Avro
    "jsonschema>=4.17.0",     # JSON Schema
    "sqlparse>=0.4.4",        # SQL DDL
]

# Dictionary loaders
loaders = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "sqlalchemy>=2.0.0",
    # application/ingest.py reads .parquet sources alongside .csv/.xlsx/.json. Its sibling
    # branches point at `nexus-matcher[loaders]` on failure; the parquet branch had to say
    # "pip install pyarrow" instead, because no extra carried it.
    "pyarrow>=14.0.0",
]

# REST API server
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
]

# CLI. Kept as an extra name so `nexus-matcher[cli]` and the `pip install -e ".[cli]"` in
# QUICKSTART still resolve, but typer and rich moved into the core dependencies -- the
# console script is declared unconditionally and cannot start without them.
#
# The `[all]` marker is also gone. It was valid when written -- typer 0.9.0 really does
# ship an `all` extra -- but typer has declared no extras at all since 0.12 (checked the
# 0.12.0 and 0.27.1 wheels: Provides-Extra is empty in both). Since the floor is a floor,
# every install resolved to a modern typer, asked it for an extra it does not have, and got
#   WARNING: typer 0.27.1 does not provide the extra 'all'
# Dropping `[all]` costs nothing: modern typer pulls click, rich, shellingham and colorama
# as ordinary dependencies, which is exactly what `all` used to add.
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

# Async processing
async = [
    "celery>=5.3.0",
]

# Full installation (all features). `colbert` is the one deliberate omission - see the
# resolver evidence on that extra above.
full = [
    "nexus-matcher[embeddings,vector-stores,sparse,accel,cache,parsers,loaders,api,cli,async]",
    "nexus-matcher[graph,observability,quantization,static-embeddings]",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    # tests/unit/infrastructure/test_bm25_vectorized.py pins the built-in BM25 scores
    # against this reference implementation; it is not a runtime dependency.
    "rank-bm25>=0.2.2",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    # Required by the integration job, which runs `pytest --timeout=120`. Without
    # this plugin pytest aborts with "unrecognized arguments: --timeout=120"
    # before collecting anything.
    "pytest-timeout>=2.1.0",
    "hypothesis>=6.82.0",
    "mypy>=1.5.0",
    "ruff>=0.0.290",
    "black>=23.7.0",
    "pre-commit>=3.3.0",
    "httpx>=0.24.0",  # For testing FastAPI
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.2.0",
    "mkdocstrings[python]>=0.23.0",
]

# =============================================================================
# ENTRY POINTS
# =============================================================================

[project.scripts]
nexus-matcher = "nexus_matcher.presentation.cli.main:app"

# Every entry point below is verified loadable by tests/unit/test_entry_points.py.
# Do not add one for a module that does not exist yet: a broken entry point makes
# plugin discovery raise at import time for every consumer of the package.

[project.entry-points."nexus_matcher.schema_parsers"]
avro = "nexus_matcher.infrastructure.adapters.schema_parsers.avro:AvroSchemaParser"
json_schema = "nexus_matcher.infrastructure.adapters.schema_parsers.json_schema:JsonSchemaParser"
sql_ddl = "nexus_matcher.infrastructure.adapters.schema_parsers.sql_ddl:SqlDdlParser"
flattened_avro = "nexus_matcher.infrastructure.adapters.schema_parsers.flattened_avro:FlattenedAvroParser"

[project.entry-points."nexus_matcher.dictionary_loaders"]
excel = "nexus_matcher.infrastructure.adapters.dictionary_loaders.excel:ExcelDictionaryLoader"
csv = "nexus_matcher.infrastructure.adapters.dictionary_loaders.excel:CsvDictionaryLoader"

[project.entry-points."nexus_matcher.vector_stores"]
qdrant = "nexus_matcher.infrastructure.adapters.vector_stores.qdrant:QdrantVectorStore"
memory = "nexus_matcher.infrastructure.adapters.vector_stores.memory:InMemoryVectorStore"
hnsw = "nexus_matcher.infrastructure.adapters.vector_stores.hnsw:HnswVectorStore"

[project.entry-points."nexus_matcher.embedding_providers"]
sentence_transformers = "nexus_matcher.infrastructure.adapters.embedding_providers.sentence_transformers:SentenceTransformersProvider"
# The default. Registered so plugin discovery can find the offline encoder too.
bundled_onnx = "nexus_matcher.infrastructure.adapters.embedding_providers.bundled_onnx:BundledOnnxProvider"
static = "nexus_matcher.infrastructure.adapters.embedding_providers.static_embedding:StaticEmbeddingProvider"

[project.urls]
Homepage = "https://github.com/pierce-lonergan/nexus_matcher"
# Was https://nexus-matcher.readthedocs.io, which returns 404 - that Read the Docs project
# was never created, so the "Documentation" link in the PyPI sidebar was a dead end. The
# docs/ tree in the repo is the documentation that actually exists (verified 200).
Documentation = "https://github.com/pierce-lonergan/nexus_matcher/tree/main/docs"
Repository = "https://github.com/pierce-lonergan/nexus_matcher"
Issues = "https://github.com/pierce-lonergan/nexus_matcher/issues"
Changelog = "https://github.com/pierce-lonergan/nexus_matcher/blob/main/CHANGELOG.md"

# =============================================================================
# BUILD CONFIGURATION
# =============================================================================

[tool.hatch.version]
path = "src/nexus_matcher/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_matcher"]
# The int8 ONNX encoder lives INSIDE the package so it ships in the wheel. It is 32.2 MiB
# against PyPI's 100 MB per-file limit. The fp32 export (127.8 MiB) does not fit and is
# deliberately not shipped.
# force-include is deliberately NOT used: _models already sits inside the package, so
# hatch picks it up via `packages` and a force-include would add every file twice.
artifacts = ["src/nexus_matcher/_models/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/benchmarks",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "QUICKSTART.md",
    "py.typed",
]
exclude = [
    "/.github",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.mypy_cache",
    "/.coverage",
    "/htmlcov",
    "/dist",
    "/build",
    "*.pyc",
    "__pycache__",
]

# =============================================================================
# TOOL CONFIGURATION
# =============================================================================

[tool.ruff]
target-version = "py310"
line-length = 100

# NOTE: `select`/`ignore`/`isort`/`per-file-ignores` moved under [tool.ruff.lint].
# The top-level spellings were deprecated in ruff 0.2 and emit a warning on every
# invocation; CI treats that warning as noise and it hides real diagnostics.

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking (was "TCH", renamed in ruff 0.8)
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific
]
ignore = [
    "E501",    # Line too long - the formatter owns line width; ruff's own docs
               # recommend disabling E501 when `ruff format` is in use.
    "PLR0913", # Too many arguments - the matching pipeline legitimately takes
               # many injected ports (parser, loader, embedder, store, retriever,
               # reranker, cache). Splitting them would be worse, not better.
    "PLR2004", # Magic value comparison - score thresholds (0.85, 0.9) read more
               # clearly inline than behind a constant name.

    # --- Rules disabled with justification, not to make numbers go down ---

    "PLC0415", # import-outside-top-level. This package's entire optional-extras
               # architecture depends on deferred imports: adapters must not pull
               # torch / qdrant_client / pandas at module-import time, or
               # `pip install nexus-matcher` (core only) breaks on import. The
               # lazy imports in domain/ports/*.py are entry-point plugin loading
               # by design. Enforcing this rule would require making every
               # optional dependency mandatory.
    "PLR0917", # too-many-positional-arguments. Same root cause as PLR0913, which
               # is already ignored above; keeping one and not the other just
               # relocates the same complaint.
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
               # Same complexity family as the already-ignored PLR0913. The hits
               # are type-mapping dispatchers (sql_ddl, type_projections) where a
               # flat run of early returns is the clearest possible spelling.

    "ARG001",  # unused-function-argument
    "ARG002",  # unused-method-argument
    "ARG003",  # unused-class-method-argument
               # Verified 2026-08-05: the hits are framework-mandated signatures,
               # not dead code. structlog processors must be
               # `(logger, method_name, event_dict)` even when only event_dict is
               # read (shared/logging.py, 12 sites); the DI Provider protocol
               # passes `container` to every provider including SingletonProvider
               # which ignores it (shared/container.py); domain/ports/*.py define
               # Protocol methods whose parameters exist for implementers.
               # Deleting these parameters breaks the callers.

    "PLW0603", # global-statement. All 8 hits are the module-level singleton
               # accessor idiom (`get_container`/`reset_container` in
               # shared/container.py, shared/metrics.py, shared/plugins.py).
               # `reset_*` exists so tests can get a clean singleton; rebinding
               # the module global is the whole point of those functions.

    "ERA001",  # commented-out-code. Both remaining hits are false positives:
               # a section banner `# COMPOSITION (allOf / anyOf / oneOf)` and an
               # explanatory formula `# Savings = unchanged / total`. This rule
               # cannot distinguish prose containing operators from dead code,
               # and deleting either comment would lose real information.
    "B027",    # empty-method-without-abstract-decorator. `Plugin.shutdown` is an
               # intentional optional no-op hook: plugins that need no teardown
               # inherit it. Marking it @abstractmethod would force every plugin
               # to implement an empty method, which is the opposite of intent.

    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
               # All 5 hits are a deliberate MULTIPLICATION SIGN in prose about
               # matrix shapes ("50k x 768"). This rule exists to catch homoglyph
               # confusion in identifiers; a math symbol in a docstring is its
               # documented false positive.
    "TC001",   # typing-only-first-party-import
    "TC002",   # typing-only-third-party-import
    "TC003",   # typing-only-standard-library-import
               # These three move runtime-visible imports into `if TYPE_CHECKING`
               # blocks. Verified empirically 2026-08-05: applying the autofix
               # (25 sites) turns 7 CLI tests red with
               # `NameError: name 'Path' is not defined`, because Typer and
               # pydantic resolve function/model annotations at runtime to build
               # the CLI and the DTOs. The rule is simply unsafe for this
               # codebase. TC004/TC005/TC006/TC010 stay enabled - they catch the
               # genuinely wrong direction and cost nothing.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]
"__init__.py" = ["F401"]

# Optional-dependency availability probes. Each of these files contains the
# `try: import x / except ImportError: X_AVAILABLE = False` idiom, where the
# import exists to be attempted, not to be used. Verified 2026-08-05 that every
# F401 in these files is that pattern - this is not a blanket F401 amnesty, F401
# stays on everywhere else and caught 9 genuinely dead imports in this pass.
"src/nexus_matcher/shared/metrics.py" = ["F401"]
"tests/unit/infrastructure/test_cross_encoder_reranker.py" = ["F401"]
"tests/unit/infrastructure/test_incremental_updates.py" = ["F401"]
"tests/unit/infrastructure/test_qdrant_vector_store.py" = ["F401"]
"tests/unit/infrastructure/test_redis_cache.py" = ["F401"]
"tests/unit/infrastructure/test_semantic_content_cache.py" = ["F401"]
# Benchmarks are experiment scripts, not shipped library code: they print,
# hardcode paths, and keep commented-out parameter sweeps on purpose.
"benchmarks/*" = ["ERA001", "T201", "PLR0912", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["nexus_matcher"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "torch.*",
    "transformers.*",
    "qdrant_client.*",
    "faiss.*",
    "rank_bm25.*",
    "celery.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# NOTE: --cov* deliberately NOT in addopts. With coverage always on, every
# partial run (`pytest tests/unit/test_one.py`) measures the whole package,
# reports a low total, and trips the fail_under gate below - so a passing
# single-file run still exits 1. Coverage is requested explicitly by CI and by
# `make test-cov` instead; the thresholds in [tool.coverage.report] still apply
# whenever it is requested.
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "e2e: End-to-end tests (full system)",
    "slow: Slow tests (skip with -m 'not slow')",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/nexus_matcher"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
# Ratchet, not an aspiration. Measured 65% (6056 stmts / 1986 missed, 1572
# branches / 227 partial) on 2026-08-05 running the full suite in an env with
# every extra except qdrant-client, redis and blake3 installed. The previous
# value was 80, which nothing ever reached, so pytest exited 1 on every green
# run and the gate taught people to ignore it.
#
# 62 sits ~3 points below today's number: it passes now, and it fails if
# coverage regresses. Raise it as coverage climbs - do not lower it.
fail_under = 62

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
