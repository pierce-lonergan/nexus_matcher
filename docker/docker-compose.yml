# docker/docker-compose.yml | Env: DEV
# Development stack with all dependencies
# SENSITIVE: No | REQUIRED_BY: local development

version: '3.8'

services:
  # ===========================================================================
  # APPLICATION
  # ===========================================================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NEXUS_ENV=development
      - NEXUS_DEBUG=true
      - NEXUS_VECTOR_BACKEND=qdrant
      - NEXUS_VECTOR_QDRANT_HOST=qdrant
      - NEXUS_VECTOR_QDRANT_PORT=6333
      - NEXUS_CACHE_ENABLE_REDIS=true
      - NEXUS_CACHE_REDIS_URL=redis://redis:6379/0
      # This stack mounts no glossary, so the matching routes cannot be answered and
      # /health/ready would never go green. Declaring matching optional is the supported
      # way to say that; without it the container is correctly reported unhealthy.
      # Set NEXUS_API_DICTIONARY and NEXUS_API_GOVERNANCE (and drop this line) to bring
      # matching up.
      - NEXUS_API_MATCHING_OPTIONAL=true
    volumes:
      - ../src:/app/src:ro
      - nexus-data:/app/data
      - nexus-models:/app/models
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health/ready, not /health: `/health` answers 200 with `status: "degraded"` when
      # the dictionary failed to load, so `curl -f` passes and `depends_on:
      # service_healthy` gates on a container that 503s every match.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # VECTOR DATABASE
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # CACHE
  # ===========================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MONITORING (Optional)
  # ===========================================================================
  # Uncomment for observability stack

  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus-data:/prometheus

  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   depends_on:
  #     - prometheus

volumes:
  nexus-data:
  nexus-models:
  qdrant-data:
  redis-data:
  # prometheus-data:
  # grafana-data:

networks:
  default:
    name: nexus-network
