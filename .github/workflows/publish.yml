# .github/workflows/publish.yml
# Publish to PyPI when a release is created

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target repository'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write  # Required for trusted publishing

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version detection
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Check package
        run: |
          twine check dist/*
          # Show package info
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  test-install:
    name: Test Installation
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      # The preflight script reads README.md and pyproject.toml as well as the wheel,
      # so the source has to be here. This job used to run without a checkout, which is
      # part of why nothing noticed the README's relative links were dead on PyPI.
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: List dist contents
        shell: bash
        run: ls -la dist/

      - name: Install package
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path
          
          # Find the wheel file
          dist_dir = Path("dist")
          wheels = list(dist_dir.glob("*.whl"))
          
          if not wheels:
              print("ERROR: No wheel files found in dist/")
              sys.exit(1)
          
          wheel_path = wheels[0]
          print(f"Installing: {wheel_path}")
          
          # Install the wheel
          result = subprocess.run(
              [sys.executable, "-m", "pip", "install", str(wheel_path)],
              check=True
          )
          sys.exit(result.returncode)

      - name: Test import
        run: |
          python -c "import nexus_matcher; print(f'Version: {nexus_matcher.__version__}')"
          python -c "from nexus_matcher import SchemaField, DictionaryEntry; print('Core imports OK')"

      # Import alone is not enough. A wheel can import fine and still be missing a
      # subpackage that only a deeper path touches -- exactly what happened when an
      # unanchored `models/` gitignore rule silently dropped domain/models from the
      # build. Walk EVERY module so a missing one fails here rather than for a user.
      - name: Verify the wheel is complete
        shell: python
        run: |
          import pkgutil, importlib, sys
          import nexus_matcher
          failed = []
          for mod in pkgutil.walk_packages(nexus_matcher.__path__, "nexus_matcher."):
              try:
                  importlib.import_module(mod.name)
              except ImportError as exc:
                  # Optional extras (torch, qdrant, redis) are legitimately absent here.
                  msg = str(exc).lower()
                  optional = (
                      "torch", "sentence_transformers", "qdrant", "redis", "fastapi",
                      "typer", "pandas", "openpyxl", "fastavro", "sqlparse",
                      "jsonschema", "bm25", "networkx", "model2vec", "sqlalchemy",
                  )
                  if any(k in msg for k in optional):
                      continue
                  failed.append(f"{mod.name}: {exc}")
              except Exception as exc:
                  failed.append(f"{mod.name}: {type(exc).__name__}: {exc}")
          if failed:
              print("Modules that failed to import from the built wheel:")
              for f in failed:
                  print("  " + f)
              sys.exit(1)
          print("all modules import cleanly")

      # The headline promise is that `pip install nexus-matcher` works with no download.
      # Prove it on every OS and Python version, with the network explicitly disabled.
      - name: Verify the bundled encoder works offline
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        shell: python
        run: |
          import sys
          from nexus_matcher.infrastructure.adapters.embedding_providers.bundled_onnx import (
              bundled_model_available, default_embedding_provider,
          )
          assert bundled_model_available(), "the wheel does not carry its model weights"
          provider = default_embedding_provider()
          docs = provider.embed_documents(["Customer Account Balance", "Transaction Date"])
          query = provider.embed_queries(["cust_acct_bal"])
          assert docs.shape == (2, 384), docs.shape
          sims = (query @ docs.T)[0]
          assert sims[0] > sims[1], f"encoder produced nonsense: {sims}"
          assert "torch" not in sys.modules, "the bundled path pulled in torch"
          print(f"offline encoder OK on {sys.platform}, similarities {sims}")

      # Replaces a step that could not fail. It ran `pip install typer rich` first --
      # installing the very dependencies whose absence was the bug -- then exercised
      # `--help`, one of the few commands that still worked, and finished with
      # `|| echo` plus `continue-on-error: true`. Three independent reasons it stayed
      # green while the published 2.0.0 CLI was unusable on a default install and
      # crashed outright on any non-UTF-8 Windows console.
      #
      # release_preflight.py installs the wheel into its OWN clean venv with no extras,
      # runs every console script for real (including under a cp437 codepage), checks
      # every __all__ name and entry point, proves the bundled encoder returns real
      # vectors, and runs an end-to-end match offline. It exits non-zero on any failure
      # and is deliberately NOT continue-on-error.
      - name: Release preflight (clean-install behaviour of the built wheel)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python scripts/release_preflight.py --wheel "$(ls dist/*.whl | head -1)"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test-install]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'

    environment:
      name: testpypi
      url: https://test.pypi.org/project/nexus-matcher/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test-install]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')

    environment:
      name: pypi
      url: https://pypi.org/project/nexus-matcher/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - no API token needed!
        # Configure at: https://pypi.org/manage/project/nexus-matcher/settings/publishing/

  create-github-release:
    name: Create GitHub Release Assets
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*