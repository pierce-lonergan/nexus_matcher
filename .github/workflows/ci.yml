# .github/workflows/ci.yml | Env: ALL
# CI/CD pipeline for NexusMatcher
# SENSITIVE: No | REQUIRED_BY: GitHub Actions

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # =========================================================================
  # LINT AND TYPE CHECK
  # =========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # Pinned: an unpinned `pip install ruff` turns every new ruff release into
        # a surprise CI failure on an unchanged commit. Bump deliberately.
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.1 mypy==2.3.0

      - name: Run Ruff linter
        # Every first-party Python directory, not a subset. scripts/ and benchmarks/ were
        # linted by nobody, and 33 errors accumulated there unnoticed (NM-0023).
        # tests/museum/NM-0023 fails if this list ever narrows again.
        run: ruff check src/nexus_matcher tests scripts benchmarks

      - name: Run Ruff formatter check
        run: ruff format --check src/nexus_matcher tests scripts benchmarks

      # MyPy is advisory for now, NOT a silent pass. [tool.mypy] sets strict=true,
      # which the codebase has never satisfied: measured 140 errors in 29 files on
      # 2026-08-05. Blocking on it would leave the pipeline permanently red, and
      # relaxing strict=true would throw away the signal. So it runs, prints, and
      # is visible in the log - and the gate flips to blocking once the count
      # reaches zero. Do not delete this step; drive the number down.
      - name: Run MyPy (advisory - see comment)
        continue-on-error: true
        run: |
          pip install -e ".[full,dev]"
          mypy src/nexus_matcher --ignore-missing-imports

  # =========================================================================
  # UNIT TESTS
  # =========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.10) and the classifiers in pyproject.toml,
        # which advertise 3.13. 3.13 was advertised but never actually tested.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        # `.[dev]` alone is not enough: tests/unit/presentation/test_api.py imports
        # fastapi and test_cli.py imports typer at module scope, so collection
        # errors out before a single test runs. The unit suite also exercises the
        # embedding, parser, loader and sparse adapters. `[full]` is what the suite
        # actually needs, and it is what the integration job already installs.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"

      - name: Run unit tests
        # --cov* live here rather than in addopts so that a partial local run does
        # not trip the fail_under gate. See the note in pyproject.toml.
        run: |
          pytest tests/unit -v --cov=nexus_matcher --cov-report=xml --cov-report=term-missing -m "not slow"

      # Its own step, not folded into the unit run, so that a failure reads as
      # "retrieval quality regressed" rather than as one more red dot among hundreds.
      # Nothing else in this workflow measures whether the system is still GOOD at
      # matching -- only that it does not crash. Every large regression this project has
      # had (a -8.9 point encoder swap, a -13.7 point aliasing default, an expander that
      # gave 787 of 793 queries zero BM25 hits) passed the entire test suite.
      #
      # Runs on the bundled encoder, which ships in the repo, so there is no download and
      # no network. ~5 seconds.
      - name: Accuracy regression gate
        run: pytest tests/regression -v

      # The permanent regression tests for every historical defect. Run as a normal suite
      # here; scripts/museum_replay.py below is the part that proves they can FAIL.
      # The gate on the gates: parses every workflow for continue-on-error, || true,
      # || echo, set +e, and steps that install the dependency whose absence they claim
      # to test. All three of those were present in the step that let 2.0.0 ship broken.
      - name: Meta gates -- CI must be able to fail
        run: pytest tests/meta -v

      # One executable check per standing hazard. A hazard is a property of the domain
      # that keeps producing new defects; docs/HAZARDS.md is the ledger.
      - name: Standing hazards
        run: pytest tests/hazards -v

      - name: Defect museum
        run: pytest tests/museum -v

      # The gate on the gates. Reintroduces each historical defect and asserts the
      # corresponding test goes red. An entry whose replay still passes is a hole in the
      # net and fails the build -- which is the whole point, because this repo has shipped
      # two gates that could not fail: a publish step carrying continue-on-error, and
      # nineteen tests that did not notice a transposed matrix multiply.
      #
      # One Python version is enough: it tests the net, not the runtime.
      - name: Museum replay -- prove every gate can fail
        if: matrix.python-version == '3.11'
        run: python scripts/museum_replay.py

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          # `file:` (singular) was removed in codecov-action v4; the plural form
          # is the supported input and the singular one is silently ignored.
          files: ./coverage.xml
          fail_ci_if_error: false

  # =========================================================================
  # INTEGRATION TESTS
  # =========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Runs on every push, not just main. It used to be main-only because the job span up
    # service containers; with those gone it is a fast in-process suite, and gating
    # develop on it is strictly better than finding out after a merge.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"

      # NOTE: this job previously started qdrant and redis service containers. It failed
      # at "Initialize containers", before checkout, because the qdrant health check runs
      # `curl` INSIDE the container and the qdrant image does not ship curl -- so it was
      # permanently unhealthy. Redis passed only because its check uses redis-cli, which
      # it does ship.
      #
      # Rather than fix the health probe, the containers were removed: nothing in
      # tests/integration touches qdrant or redis. The suite exercises schema parsers,
      # abbreviation expansion, domain hierarchy and type compatibility, all in process.
      # Two containers were being started, and one CI job failed, for services no test
      # used. If a test ever does need them, add the container back with a probe the
      # image can actually run (or poll from the runner, which has curl).
      - name: Run integration tests
        run: pytest tests/integration -v --timeout=120

  # =========================================================================
  # SECURITY SCAN
  # =========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Check for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # BUILD
  # =========================================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # =========================================================================
  # DOCKER BUILD
  # =========================================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: nexus-matcher:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # PUBLISH (on release)
  # =========================================================================
  # Releasing is owned by publish.yml, not this workflow.
  #
  # There used to be a second `publish` job here, triggered on a v* tag, which uploaded
  # straight from the build artifact. It duplicated publish.yml and skipped that
  # workflow's cross-platform install check -- the check that would have caught a wheel
  # missing an entire subpackage. One publish path, with verification, is safer than two.
  #
  # To release: create a GitHub Release (or run publish.yml manually against testpypi).
