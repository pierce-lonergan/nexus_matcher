# .github/workflows/ci.yml | Env: ALL
# CI/CD pipeline for NexusMatcher
# SENSITIVE: No | REQUIRED_BY: GitHub Actions

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # =========================================================================
  # LINT AND TYPE CHECK
  # =========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # Pinned: an unpinned `pip install ruff` turns every new ruff release into
        # a surprise CI failure on an unchanged commit. Bump deliberately.
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.1 mypy==2.3.0

      - name: Run Ruff linter
        run: ruff check src/nexus_matcher tests

      - name: Run Ruff formatter check
        run: ruff format --check src/nexus_matcher tests

      # MyPy is advisory for now, NOT a silent pass. [tool.mypy] sets strict=true,
      # which the codebase has never satisfied: measured 140 errors in 29 files on
      # 2026-08-05. Blocking on it would leave the pipeline permanently red, and
      # relaxing strict=true would throw away the signal. So it runs, prints, and
      # is visible in the log - and the gate flips to blocking once the count
      # reaches zero. Do not delete this step; drive the number down.
      - name: Run MyPy (advisory - see comment)
        continue-on-error: true
        run: |
          pip install -e ".[full,dev]"
          mypy src/nexus_matcher --ignore-missing-imports

  # =========================================================================
  # UNIT TESTS
  # =========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.10) and the classifiers in pyproject.toml,
        # which advertise 3.13. 3.13 was advertised but never actually tested.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        # `.[dev]` alone is not enough: tests/unit/presentation/test_api.py imports
        # fastapi and test_cli.py imports typer at module scope, so collection
        # errors out before a single test runs. The unit suite also exercises the
        # embedding, parser, loader and sparse adapters. `[full]` is what the suite
        # actually needs, and it is what the integration job already installs.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"

      - name: Run unit tests
        # --cov* live here rather than in addopts so that a partial local run does
        # not trip the fail_under gate. See the note in pyproject.toml.
        run: |
          pytest tests/unit -v --cov=nexus_matcher --cov-report=xml --cov-report=term-missing -m "not slow"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          # `file:` (singular) was removed in codecov-action v4; the plural form
          # is the supported input and the singular one is silently ignored.
          files: ./coverage.xml
          fail_ci_if_error: false

  # =========================================================================
  # INTEGRATION TESTS
  # =========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,dev]"

      - name: Run integration tests
        env:
          NEXUS_VECTOR_QDRANT_HOST: localhost
          NEXUS_VECTOR_QDRANT_PORT: 6333
          NEXUS_CACHE_REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/integration -v --timeout=120

  # =========================================================================
  # SECURITY SCAN
  # =========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Check for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # BUILD
  # =========================================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # =========================================================================
  # DOCKER BUILD
  # =========================================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: nexus-matcher:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # PUBLISH (on release)
  # =========================================================================
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/nexus-matcher

    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
