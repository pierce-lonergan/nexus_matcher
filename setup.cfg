# setup.cfg | Layer: GATE (configuration)
# Mutation-testing scope and per-group test commands. Read by mutmut AND by noxfile.py.
#
# This file exists ONLY for mutmut. The build backend is hatchling (see pyproject.toml),
# which never reads setup.cfg, so nothing here reaches the wheel or the sdist.
#
# WHY mutmut 2.4.5 AND NOT 3.x
# ---------------------------
# mutmut 3.x refuses to start on Windows -- `mutmut/__main__.py` prints "please use the
# WSL" and calls sys.exit(1) before it imports anything, and the module below that import
# needs `resource`, which does not exist on Windows at all. This repo is developed on
# Windows, so a gate that only runs under WSL is a gate most people here will never run.
# 2.4.5 is the last release that runs natively; pin it exactly, because it is unmaintained
# and nothing guarantees the next 2.x behaves the same.
#
# WHY THE SUPPORTED ENTRY POINT IS `nox -s mutation` AND NOT BARE `mutmut run`
# ---------------------------------------------------------------------------
# mutmut 2.x mutates files IN PLACE: it writes the broken source into src/, runs the
# tests, and restores it afterwards. On a machine where other people (or other agents)
# are running pytest against this same tree, that hands them a deliberately-broken source
# file for a few hundred milliseconds at a time, a few thousand times in a row -- and a
# hard kill in the middle leaves the tree broken for good. `nox -s mutation` copies the
# tree somewhere else first and mutates the copy, so the repo is never touched. Running
# `mutmut run` directly in this directory works, and will mutate this checkout.
#
# WHY THE SCOPE IS THREE GROUPS AND NOT ONE RUN
# --------------------------------------------
# mutmut has one global test command. Running the whole selected suite for every mutant
# costs ~8s per mutant here, or roughly three and a half hours for the 1607 mutants in
# scope. Each group below pairs a set of mutated files with the smallest test command
# that covers them, which is what brings the run into the tens of minutes.
#
# The `tests` list of each group is not a guess. It was verified by comparing the set of
# lines that group's command executes in its own target files against the set the WHOLE
# suite executes in those files: they are identical, per group, per file. That check is
# what stops a survivor from meaning "the killing test simply was not in the command".
# Re-run it if you change either list -- see noxfile.py, `verify-mutation-scope`.

[mutmut]
# The mutmut-native keys. mutmut reads these when invoked bare.
#
# noxfile.py does NOT pass `paths_to_mutate` through: it runs group by group and passes
# each group's own `paths`. So these two lists are two different descriptions of the same
# scope, and they used to be free to drift -- shrinking this one changed nothing about
# `nox -s mutation` while quietly shrinking what a bare `mutmut run` measures. The session
# now expands both and refuses to start unless they name exactly the same files.
#
# NOTE: mutmut prefers [tool.mutmut] in pyproject.toml over this file and falls back here
# only when that section is absent. noxfile.py refuses to run if that section ever
# appears, rather than letting this file be silently ignored.
paths_to_mutate = src/nexus_matcher/domain/services/:src/nexus_matcher/application/use_cases/match_schema.py:src/nexus_matcher/infrastructure/adapters/sparse_retrievers/bm25.py
tests_dir = tests/
#
# `--timeout=60` is LOad-BEARING, not tidiness. A mutant can turn a loop into an infinite
# one -- `while current is not None` with the advance deleted, for instance -- and pytest
# then never returns. mutmut has its own per-mutant timer, but on Windows it runs the test
# command through `cmd.exe` and kills only the shell: the pytest grandchild survives,
# keeps the pipe open, and mutmut blocks reading it FOREVER. That is what wedged the first
# full run of this suite, 245 mutants from the end, with an orphaned pytest still burning
# a core ten minutes later. Making pytest time itself out fixes it at the right level, and
# the resulting non-zero exit is an honest kill: a mutant that hangs the suite IS detected
# by the suite. 60s against a group baseline under 4s leaves enormous headroom for load.
#
# Requires pytest-timeout. noxfile.py refuses to run without it, because a missing plugin
# turns this flag into "unrecognized arguments" -- and a test command that fails for every
# mutant reports every mutant as killed.
runner = python -m pytest -x -q --no-header --assert=plain -p no:cacheprovider -p no:randomly --timeout=60 --timeout-method=thread
dict_synonyms =

[mutmut.scope]
# Groups run in this order. Each name must have a [mutmut.group:<name>] section.
groups =
    domain-services
    match-schema
    bm25

# RATCHET. Killed / decided over the whole scope above, as a percentage. MEASURED on
# 2026-08-09 -- 796 of 1607 mutants killed, every one decided -- not aspirational. It may
# only rise; see docs/DEFENSIBILITY.md. Lowering it is a written, measured decision.
#
# Do not read 49.5% as "half the tests are useless". 432 of the 811 survivors are single
# rows of lookup literals (one abbreviation, one type-pair score). Over executable logic
# alone the same run scores 62.9%. Both numbers are printed by the session, and the
# survivor-by-survivor triage is in docs/mutation_survivors.md.
score_floor = 49.5

# Second ratchet: EVERY survivor the run produces must appear in
# docs/mutation_survivors.md. A survivor that is not in that file is a hole nobody has
# looked at, and the session fails rather than letting it pass unremarked. This number is
# the ceiling on how many there may be; it may only fall.
survivors_documented = 811

# THIRD RATCHET, and the one that makes the other two mean anything: THE POPULATION.
#
# score_floor and survivors_documented say nothing about how much was measured. Delete a
# path from `paths_to_mutate` or from a group's `paths` and both of them are satisfied
# perfectly -- a smaller population still has a score, and it has strictly fewer survivors.
# A ratchet you can satisfy by MEASURING LESS is not a ratchet; it is a dial wearing a
# ratchet's clothes, which is worse than having neither, because it reports a safety it
# does not provide. (Second-round adjudication found exactly this, docs/DEFENSIBILITY.md.)
#
# So the population itself is pinned: every file that must be mutated, and how many mutants
# mutmut generated for it. MEASURED on 2026-08-09, same run as score_floor -- 1607 mutants,
# every one decided. noxfile.py refuses to START if the configured paths no longer expand
# to exactly this list, and refuses to SCORE if the run did not reach a verdict on exactly
# these counts. The user-visible consequence: a run that covers less than this can no
# longer report a number at all, so "the score went up" can never mean "we measured less".
#
# Widening the scope is a good change and it fails here too, deliberately. A new file's
# count, score_floor and survivors_documented all have to be re-measured in the same edit,
# which is the only way the three numbers keep describing the same population.
#
# Format: one `<mutants> <path>` per line.
scope_mutants =
    464  src/nexus_matcher/application/use_cases/match_schema.py
    224  src/nexus_matcher/domain/services/abbreviation.py
    168  src/nexus_matcher/domain/services/alias_generation.py
    113  src/nexus_matcher/domain/services/context_enricher.py
    195  src/nexus_matcher/domain/services/domain_hierarchy.py
    230  src/nexus_matcher/domain/services/type_compatibility.py
    213  src/nexus_matcher/infrastructure/adapters/sparse_retrievers/bm25.py

# mutmut 2.4.5 deadlocks on Windows: both of its processes drop to 0% CPU with no pytest
# child and never recover. Seen once, 245 mutants from the end of a 1607-mutant run. The
# session watches for "nothing written to the cache in this many minutes" and resumes from
# the cache; a wall-clock limit cannot tell a deadlock from a slow box, and this can.
#
# The watchdog is only ARMED while pinned mutants above are still undecided. It used to
# watch mutmut's count of `untested` rows, which is 0 from the first second of any resumed
# run -- so it never moved, every healthy run looked deadlocked, and the run was killed and
# then scored as if it had finished. Silence with nothing left to decide is mutmut
# replaying its cache, not a deadlock, and this session now waits it out.
stall_minutes = 10
max_restarts = 5

[mutmut.group:domain-services]
paths =
    src/nexus_matcher/domain/services/
tests =
    tests/unit/domain/test_abbreviation.py
    tests/unit/domain/test_context_enricher.py
    tests/unit/domain/test_domain_hierarchy.py
    tests/unit/domain/test_type_compatibility.py
    tests/unit/test_regression_guards.py
    tests/integration/test_abbreviation_integration.py
    tests/integration/test_domain_hierarchy_integration.py
    tests/integration/test_type_compatibility_integration.py

[mutmut.group:match-schema]
paths =
    src/nexus_matcher/application/use_cases/match_schema.py
tests =
    tests/unit/application/test_batch_match.py
    tests/unit/application/test_batched_dense_retrieval.py
    tests/unit/application/test_match_result_identity.py
    tests/unit/application/test_matching_config.py
    tests/unit/application/test_scoring_hot_path.py
    tests/unit/test_regression_guards.py
    # A single node id, not the file: this one test is the ONLY thing in the suite that
    # reaches match_schema.py lines 251, 794, 1129, 1207 and 1242, and its three siblings
    # cost another ~1.6s per mutant while reaching nothing new. `verify-mutation-scope`
    # found the gap and will find it again if this test is renamed or moved.
    tests/properties/test_conservation.py::test_every_field_produces_exactly_one_result

[mutmut.group:bm25]
paths =
    src/nexus_matcher/infrastructure/adapters/sparse_retrievers/bm25.py
tests =
    tests/unit/infrastructure/test_bm25_index_build.py
    tests/unit/infrastructure/test_bm25_vectorized.py
